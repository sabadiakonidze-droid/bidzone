<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8ff"><title>BidZone 3.0 — Demo</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#20243b;background:#f7f8ff}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}.app{max-width:650px;margin:auto;min-height:100dvh;padding-bottom:94px}.top{position:sticky;top:0;z-index:5;background:#f7f8ffed;backdrop-filter:blur(15px);padding:17px 18px 12px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:950;font-size:27px;letter-spacing:-1.5px}.logo span{color:#6d4aff}.pill{border:0;border-radius:50px;background:white;padding:10px 14px;box-shadow:0 5px 20px #2624510e;font-weight:750}.content{padding:4px 17px 25px}.hero{background:linear-gradient(125deg,#7255ff,#a16fff 55%,#fa86a9);border-radius:25px;color:white;padding:25px 22px;position:relative;overflow:hidden;margin:6px 0 19px}.hero:after{content:'✦';position:absolute;right:17px;top:15px;font-size:80px;opacity:.23}.hero small{font-weight:700;opacity:.9}.hero h1{font-size:27px;line-height:1.14;margin:9px 0 8px;max-width:260px}.hero p{margin:0;font-size:13px;opacity:.9;max-width:260px}.search{width:100%;border:1px solid #e7e7f4;border-radius:16px;padding:15px 16px;background:white;outline:none;margin-bottom:13px}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:13px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid #e9e8f6;border-radius:30px;background:white;padding:10px 14px;font-size:13px;font-weight:700}.chip.active{background:#6d4aff;color:white;border-color:#6d4aff}.section{display:flex;justify-content:space-between;align-items:center;margin:11px 0 14px}.section h2{font-size:19px;margin:0;letter-spacing:-.5px}.muted{color:#85869b;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{background:white;border:1px solid #efedf8;border-radius:21px;overflow:hidden;box-shadow:0 8px 25px #302c6b08;position:relative}.product img{width:100%;height:153px;object-fit:contain;background:linear-gradient(145deg,#f4f2ff,#fff4f7);padding:13px}.prod-body{padding:12px}.prod-body h3{font-size:14px;margin:6px 0;min-height:34px}.status{font-size:10px;font-weight:850;border-radius:20px;padding:5px 8px;background:#e8fff1;color:#11975d;display:inline-block}.status.future{background:#fff1db;color:#b57615}.status.ended{background:#eeeef4;color:#74768b}.price{font-size:22px;font-weight:900;color:#6545ef;margin:6px 0}.btn{border:0;background:#6d4aff;color:white;border-radius:14px;padding:13px 16px;font-weight:800}.btn.full{width:100%}.btn.light{background:#f0edff;color:#6448e9}.heart{position:absolute;top:9px;right:9px;background:#fff;border:0;border-radius:50%;width:34px;height:34px;font-size:20px;box-shadow:0 3px 12px #0001}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:650px;width:100%;background:#fffffff5;backdrop-filter:blur(15px);border-top:1px solid #eeedf6;display:grid;grid-template-columns:repeat(4,1fr);padding:11px 8px max(12px,env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:transparent;color:#9495a7;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}.nav button b{font-size:21px}.nav button.active{color:#6d4aff}.back{background:none;border:0;color:#6d4aff;font-weight:800;padding:8px 0 15px}.gallery{background:linear-gradient(145deg,#f0edff,#fff0f4);border-radius:25px;overflow:hidden;position:relative}.gallery img{display:block;width:100%;height:270px;object-fit:contain;padding:18px}.gallery-controls{display:flex;justify-content:center;gap:8px;padding:0 0 13px}.gallery-controls button{border:0;border-radius:50%;height:9px;width:9px;background:#d5c9fa;padding:0}.gallery-controls button.active{background:#6d4aff;width:22px;border-radius:8px}.detail-title{font-size:25px;margin:16px 0 7px}.detail-box{background:white;border:1px solid #efedf8;border-radius:20px;padding:17px;margin-top:14px}.detail-price{font-size:37px;font-weight:950;color:#6545ef}.timer{font-variant-numeric:tabular-nums;font-size:25px;font-weight:900}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stats>div{background:#f8f7ff;border-radius:14px;padding:12px}.stats strong{display:block;margin-top:4px}.list-row{display:flex;justify-content:space-between;gap:8px;padding:12px 0;border-bottom:1px solid #f0eff7;font-size:13px}.list-row:last-child{border:0}.empty{text-align:center;padding:40px 12px;color:#8889a1}.form{display:grid;gap:12px}.form input{width:100%;padding:14px;border-radius:13px;border:1px solid #e7e7f4}.note{font-size:12px;line-height:1.6;color:#797b92}.toast{position:fixed;z-index:30;left:50%;bottom:95px;transform:translateX(-50%);background:#262044;color:white;padding:12px 18px;border-radius:16px;max-width:90%;width:max-content;box-shadow:0 10px 25px #0003;font-size:13px}.filter{display:flex;gap:8px;margin-bottom:13px;overflow:auto}.filter button{border:0;border-radius:20px;background:#eeecf9;padding:8px 12px;font-weight:700;color:#686880;white-space:nowrap}.filter button.active{background:#6d4aff;color:white}.rule{line-height:1.7;font-size:14px;color:#5d6075}a{color:#6545ef}@media(min-width:550px){.product img{height:205px}.grid{gap:17px}}
</style></head><body><div id="app" class="app"></div><script>
'use strict';
const images={phone:['https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=800&q=85','https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=800&q=85'],console:['https://images.unsplash.com/photo-1606813907291-d86efa9b94db?w=800&q=85','https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=800&q=85'],headphones:['https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=800&q=85','https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=800&q=85'],watch:['https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=800&q=85','https://images.unsplash.com/photo-1508685096489-7aacd43bd3b1?w=800&q=85'],laptop:['https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=800&q=85','https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=800&q=85'],camera:['https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=800&q=85','https://images.unsplash.com/photo-1502920917128-1aa500764cbd?w=800&q=85']};
const catalog=[{id:'iphone',title:'iPhone 16 Pro 256GB',cat:'ტელეფონები',kind:'phone',price:1.25,secs:350,desc:'პრემიუმ სმარტფონი, მაღალი ხარისხის კამერით და სწრაფი პროცესორით.',spec:['256GB მეხსიერება','Pro კამერის სისტემა','სატესტო ლოტი']},{id:'ps5',title:'PlayStation 5 Slim',cat:'გეიმინგი',kind:'console',price:2.43,secs:520,desc:'თანამედროვე სათამაშო კონსოლი სახლის გართობისთვის.',spec:['Slim ვერსია','თამაშების მხარდაჭერა','სატესტო ლოტი']},{id:'airpods',title:'Premium Wireless Headphones',cat:'ტექნიკა',kind:'headphones',price:0.76,secs:245,desc:'უკაბელო ყურსასმენები ყოველდღიური გამოყენებისთვის.',spec:['Bluetooth','კომფორტული დიზაინი','სატესტო ლოტი']},{id:'watch',title:'Smart Watch',cat:'ტექნიკა',kind:'watch',price:0.95,secs:0,desc:'ჭკვიანი საათის სატესტო აუქციონი.',spec:['სენსორული ეკრანი','აქტივობის მონიტორინგი','სატესტო ლოტი']},{id:'mac',title:'Laptop Pro 13-inch',cat:'ტექნიკა',kind:'laptop',price:3.4,secs:-1,desc:'მსუბუქი ლეპტოპი სამუშაოსა და სწავლისთვის.',spec:['13-დუიმიანი ეკრანი','პორტატული','სატესტო ლოტი']},{id:'camera',title:'Digital Mirrorless Camera',cat:'ტექნიკა',kind:'camera',price:1.15,secs:780,desc:'ციფრული კამერა ფოტოებისა და ვიდეოებისთვის.',spec:['ციფრული კამერა','ცვლადი ობიექტივი (მოდელზე დამოკიდებული)','სატესტო ლოტი']}];
const KEY='bidzone3_demo_v1';let store;try{store=JSON.parse(localStorage.getItem(KEY))||{}}catch{store={}};if(!store.auctions){store={balance:100,username:'',favorites:[],myBids:[],auctions:{},started:Date.now()};for(const p of catalog){store.auctions[p.id]={price:Math.round(p.price*100),end:p.secs>0?Date.now()+p.secs*1000:null,status:p.secs===0?'ended':p.secs<0?'future':'live',history:[],winner:null}}}function save(){localStorage.setItem(KEY,JSON.stringify(store))}
let view='home',selected=null,cat='ყველა',filter='ყველა',search='',photo=0,authMode='register',toastTimeout;const $=s=>document.querySelector(s);const money=c=>(c/100).toFixed(2)+' ₾';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function status(id){let a=store.auctions[id];if(a.status==='live'&&Date.now()>=a.end){a.status='ended';a.winner=a.history.length?a.history[0].name:null;save()}return a.status}function time(ms){let s=Math.max(0,Math.ceil(ms/1000));return `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}function msg(t){document.querySelector('.toast')?.remove();let n=document.createElement('div');n.className='toast';n.textContent=t;document.body.appendChild(n);clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>n.remove(),2600)}function header(){return `<header class="top"><div class="logo">Bid<span>Zone</span><span style="font-size:10px;vertical-align:top;color:#999"> DEMO</span></div><button class="pill" onclick="go('profile')">🪙 ${store.balance} ბიდი</button></header>`}function nav(){return `<nav class="nav">${[['home','⌂','მთავარი'],['favorites','♡','რჩეულები'],['wins','🏆','მოგებული'],['profile','◉','პროფილი']].map(([v,i,t])=>`<button class="${view===v?'active':''}" onclick="go('${v}')"><b>${i}</b>${t}</button>`).join('')}</nav>`}function product(p){let a=store.auctions[p.id],st=status(p.id),fav=store.favorites.includes(p.id);return `<article class="product"><button class="heart" aria-label="რჩეულებში" onclick="favorite('${p.id}')">${fav?'♥':'♡'}</button><img loading="lazy" src="${images[p.kind][0]}" alt="${esc(p.title)}" onerror="this.style.opacity='.1'"><div class="prod-body"><span class="status ${st==='future'?'future':st==='ended'?'ended':''}">${st==='live'?'● მიმდინარეობს':st==='future'?'◷ მალე':'✓ დასრულდა'}</span><h3>${esc(p.title)}</h3><div class="price">${money(a.price)}</div><div class="muted" data-timer="${p.id}">${st==='live'?time(a.end-Date.now()):st==='future'?'მალე დაიწყება':'დასრულებულია'}</div><button class="btn full" style="margin-top:11px" onclick="detail('${p.id}')">ნახვა →</button></div></article>`}function home(){let list=catalog.filter(p=>(cat==='ყველა'||p.cat===cat)&&(filter==='ყველა'||status(p.id)===filter)&&p.title.toLowerCase().includes(search.toLowerCase()));return `<div class="hero"><small>✨ ახალი გამოცდილება</small><h1>შენი შემდეგი აღმოჩენა აქ იწყება</h1><p>გამოსცადე აუქციონი ვირტუალური ბიდებით — რეალური ფულის გარეშე.</p></div><input class="search" aria-label="ძებნა" placeholder="🔎 მოძებნე სასურველი ნივთი..." value="${esc(search)}" oninput="search=this.value;refreshProducts()"><div class="chips">${['ყველა','ტელეფონები','ტექნიკა','გეიმინგი'].map(c=>`<button class="chip ${cat===c?'active':''}" onclick="cat='${c}';render()">${c}</button>`).join('')}</div><div class="section"><h2>აუქციონები ✨</h2><span class="muted">${list.length} ნივთი</span></div><div class="filter">${[['ყველა','ყველა'],['live','მიმდინარე'],['future','მომავალი'],['ended','დასრულებული']].map(([v,t])=>`<button class="${filter===v?'active':''}" onclick="filter='${v}';render()">${t}</button>`).join('')}</div><div id="products" class="grid">${list.map(product).join('')||'<div class="empty">ნივთები ვერ მოიძებნა</div>'}</div>`}function refreshProducts(){let el=$('#products');if(el)el.innerHTML=catalog.filter(p=>(cat==='ყველა'||p.cat===cat)&&(filter==='ყველა'||status(p.id)===filter)&&p.title.toLowerCase().includes(search.toLowerCase())).map(product).join('')||'<div class="empty">ნივთები ვერ მოიძებნა</div>'}function detail(id){selected=id;photo=0;go('detail')}function detailPage(){let p=catalog.find(x=>x.id===selected);if(!p)return home();let a=store.auctions[p.id],st=status(p.id);return `<button class="back" onclick="go('home')">← ყველა აუქციონი</button><div class="gallery"><img id="heroimg" src="${images[p.kind][photo]}" alt="${esc(p.title)}"><div class="gallery-controls">${images[p.kind].map((_,i)=>`<button aria-label="ფოტო ${i+1}" class="${i===photo?'active':''}" onclick="changePhoto(${i})"></button>`).join('')}</div></div><h1 class="detail-title">${esc(p.title)}</h1><span class="status ${st==='future'?'future':st==='ended'?'ended':''}">${st==='live'?'● მიმდინარეობს':st==='future'?'◷ მალე დაიწყება':'✓ დასრულებულია'}</span><div class="detail-box"><div class="muted">მიმდინარე ფასი</div><div class="detail-price" id="detailprice">${money(a.price)}</div><div class="stats"><div><span class="muted">დარჩენილი დრო</span><strong class="timer" data-timer="${p.id}">${st==='live'?time(a.end-Date.now()):'—'}</strong></div><div><span class="muted">ბოლო მონაწილე</span><strong id="lastbid">${esc(a.history[0]?.name||'ჯერ არავინ')}</strong></div></div><button class="btn full" style="margin-top:15px;font-size:16px" ${st!=='live'?'disabled':''} onclick="placeBid('${p.id}')">${st==='live'?'🪙 ბიდის დადება — 1 ვირტუალური ბიდი':st==='future'?'აუქციონი ჯერ არ დაწყებულა':'აუქციონი დასრულებულია'}</button><p class="note">ყოველი ბიდი ფასს ზრდის 0.01 ₾-ით. ბოლო 5 წამში დადებული ბიდი ტაიმერს 5 წამზე აყენებს. ბიდის დაგეგმილი რეალური ღირებულებაა 0.20 ₾, მაგრამ ამ დემოში გადახდები არ არსებობს.</p></div><div class="detail-box"><h3>აღწერა და მახასიათებლები</h3><p class="rule">${esc(p.desc)}</p>${p.spec.map(x=>`<div class="list-row"><span>✓ ${esc(x)}</span></div>`).join('')}</div><div class="detail-box"><h3>ბიდების ისტორია</h3><div id="history">${historyHTML(a)}</div></div>${st==='ended'?`<div class="detail-box"><h3>🏆 გამარჯვებული</h3><p>${esc(a.winner||'გამარჯვებული არ არის')}</p></div>`:''}`}
function historyHTML(a){return a.history.length?a.history.slice(0,25).map(h=>`<div class="list-row"><span>🪙 ${esc(h.name)}</span><strong>${money(h.price)} · ${new Date(h.at).toLocaleTimeString('ka-GE')}</strong></div>`).join(''):'<p class="muted">ჯერ ბიდები არ არის.</p>'}function changePhoto(i){photo=i;render()}function favorite(id){store.favorites=store.favorites.includes(id)?store.favorites.filter(x=>x!==id):[...store.favorites,id];save();render()}function placeBid(id){if(!store.username){msg('ჯერ შექმენი სატესტო პროფილი');go('profile');return}let a=store.auctions[id];if(status(id)!=='live'){msg('აუქციონი დასრულებულია');render();return}if(store.balance<1){msg('ვირტუალური ბიდები ამოიწურა');return}store.balance--;a.price+=1;let now=Date.now();if(a.end-now<=5000)a.end=now+5000;a.history.unshift({name:store.username,price:a.price,at:now});store.myBids.unshift({id,price:a.price,at:now});save();render();msg('ბიდი წარმატებით დაიდო!')}function profile(){return `<h2>👤 ჩემი პროფილი</h2><div class="detail-box"><div class="muted">სატესტო ბალანსი</div><div class="detail-price">🪙 ${store.balance}</div><p class="note">მონეტები ვირტუალურია, ფულად ღირებულებას არ წარმოადგენს.</p></div>${store.username?`<div class="detail-box"><h3>გამარჯობა, ${esc(store.username)} 👋</h3><p class="muted">დემო პროფილი მხოლოდ ამ ბრაუზერში ინახება.</p><button class="btn light" onclick="logout()">პროფილიდან გასვლა</button></div>`:`<div class="detail-box"><h3>${authMode==='register'?'დემო რეგისტრაცია':'დემო შესვლა'}</h3><form class="form" onsubmit="signIn(event)"><input id="username" maxlength="24" required placeholder="შეიყვანე სახელი"><button class="btn full">${authMode==='register'?'პროფილის შექმნა':'შესვლა'}</button></form><p class="note">ეს არ არის რეალური ავთენტიფიკაცია. პაროლი და პერსონალური მონაცემები არ შეიყვანო.</p><button class="btn light" onclick="authMode=authMode==='register'?'login':'register';render()">${authMode==='register'?'უკვე გაქვს დემო პროფილი?':'ახალი დემო პროფილი'}</button></div>`}<div class="detail-box"><h3>ჩემი ბიდები (${store.myBids.length})</h3>${store.myBids.slice(0,30).map(b=>`<div class="list-row"><span>${esc(catalog.find(p=>p.id===b.id)?.title||'ნივთი')}</span><strong>${money(b.price)}</strong></div>`).join('')||'<p class="muted">ჯერ ბიდი არ დაგიდია.</p>'}</div><div class="detail-box"><button class="btn light full" onclick="go('rules')">📋 წესები და დახმარება</button></div><button class="btn light full" onclick="resetDemo()">↺ დემოს განულება</button>`}function signIn(e){e.preventDefault();let n=$('#username').value.trim();if(!n)return;store.username=n;save();render();msg('დემო პროფილი მზადაა')}function logout(){store.username='';save();render()}function resetDemo(){if(confirm('გინდა ყველა სატესტო მონაცემის წაშლა?')){localStorage.removeItem(KEY);location.reload()}}function favorites(){let a=catalog.filter(p=>store.favorites.includes(p.id));return `<h2>♡ რჩეული ნივთები</h2><div class="grid">${a.map(product).join('')||'<div class="empty">რჩეულებში ჯერ არაფერია. ნივთის ♥ ღილაკს დააჭირე.</div>'}</div>`}function wins(){let a=catalog.filter(p=>status(p.id)==='ended'&&store.auctions[p.id].winner&&store.auctions[p.id].winner===store.username);return `<h2>🏆 ჩემი მოგებული აუქციონები</h2><p class="note">დემოში გამარჯვებული არის ბოლო ბიდის ავტორი ტაიმერის დასრულებისას.</p><div class="grid">${a.map(product).join('')||'<div class="empty">ჯერ მოგებული აუქციონი არ გაქვს.</div>'}</div>`}function rules(){return `<button class="back" onclick="go('profile')">← პროფილი</button><h2>📋 წესები და დახმარება</h2><div class="detail-box rule"><p><strong>1. სატესტო გარემო:</strong> BidZone 3.0 მხოლოდ დემოა. არც რეალური ფული და არც რეალური ნივთები არ გაიცემა.</p><p><strong>2. ბიდები:</strong> ყოველი ბიდი აკლებს 1 ვირტუალურ ბიდს და ფასს ზრდის 0.01 ₾-ით.</p><p><strong>3. დრო:</strong> თუ ბიდი ბოლო 5 წამში დაიდო, ტაიმერი ისევ 5 წამზე დადგება.</p><p><strong>4. გამარჯვებული:</strong> ტაიმერის დასრულებისას ბოლო ბიდის ავტორი იმარჯვებს მხოლოდ ამ დემოში.</p><p><strong>5. ანგარიშები:</strong> მონაცემები ინახება ამ მოწყობილობის ბრაუზერში; სხვადასხვა მოწყობილობის მომხმარებლები ერთმანეთს ვერ ხედავენ.</p><p><strong>6. დახმარება:</strong> განულება შესაძლებელია პროფილის გვერდიდან. რეალური გადახდები და რეგისტრაცია ჯერ არ არის ჩართული.</p></div>`}function go(v){view=v;render();window.scrollTo(0,0)}function render(){for(const p of catalog)status(p.id);$('#app').innerHTML=header()+`<main class="content">${view==='home'?home():view==='detail'?detailPage():view==='favorites'?favorites():view==='wins'?wins():view==='profile'?profile():rules()}</main>`+nav()}setInterval(()=>{let changed=false;for(const p of catalog){let before=store.auctions[p.id].status;if(status(p.id)!==before)changed=true}if(changed){render();return}document.querySelectorAll('[data-timer]').forEach(el=>{let a=store.auctions[el.dataset.timer];if(a&&a.status==='live')el.textContent=time(a.end-Date.now())})},250);render();
</script></body></html>
